<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Admin Dashboard</title>
</head>
<body>

  <h1>ADMIN DASHBOARD</h1>

  <hr>

  <h2>Create User</h2>
  <input id="newEmail" placeholder="Email">
  <input id="newPassword" placeholder="Password">
  <input id="newName" placeholder="Name">
  <input id="newSurname" placeholder="Surname">
  <input id="newBirthdate" type="date">
  <select id="newRole">
    <option value="PRODUCER">PRODUCER</option>
    <option value="JURY">JURY</option>
    <option value="ADMIN">ADMIN</option>
  </select>
  <button onclick="createUser()">Create</button>

  <hr>

  <h2>Users</h2>
  <button onclick="getUsers()">Load Users</button>
  <div id="users"></div>

  <hr>

  <h2>Videos</h2>
  <button onclick="getVideos()">Load Videos</button>
  <div id="videos"></div>

  <hr>

  <h2>Assign Video → Jury</h2>
  <input id="videoId" placeholder="Video ID">
  <input id="juryId" placeholder="Jury User ID">
  <button onclick="assignVideo()">Assign</button>

  <script>

    const API = "http://localhost:3000";

    /* ================= USERS ================= */

  async function getUsers() {
  const res = await fetch(`${API}/users`);
  const data = await res.json();

  const container = document.getElementById("users");
  container.innerHTML = "";

  data.forEach(user => {
    container.innerHTML += `
      <div style="margin-bottom:15px; padding:10px; border:1px solid #ccc;">
        <strong>ID:</strong> ${user.id} <br>
        <strong>Email:</strong> ${user.email} <br>
        <strong>Name:</strong> ${user.name} <br>
        <strong>Surname:</strong> ${user.surname} <br>
        <strong>Birthdate:</strong> ${user.birthdate} <br>
        <strong>Role:</strong> ${user.role} <br><br>

        <button onclick="changeRole(${user.id}, 'JURY')">Make JURY</button>
        <button onclick="changeRole(${user.id}, 'PRODUCER')">Make PRODUCER</button>
        <button onclick="changeRole(${user.id}, 'ADMIN')">Make ADMIN</button>
        <button onclick="deleteUser(${user.id})" style="color:red;">Delete</button>
      </div>
    `;
  });
}



    async function changeRole(id, role) {
      await fetch(`${API}/users/${id}/role`, {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ role })
      });

      getUsers();
    }

    async function createUser() {
      const email = document.getElementById("newEmail").value;
      const password = document.getElementById("newPassword").value;
      const role = document.getElementById("newRole").value;
      const name = document.getElementById("newName").value;
      const surname = document.getElementById("newSurname").value;
      const birthdate = document.getElementById("newBirthdate").value;

      await fetch(`${API}/users`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email, password, role, name, surname, birthdate })
      });

      alert("User created");
      getUsers();
    }

    async function deleteUser(id) {
  const confirmDelete = confirm("Are you sure you want to delete this user?");
  if (!confirmDelete) return;

  await fetch(`${API}/users/${id}`, {
    method: "DELETE"
  });

  alert("User deleted!");
  getUsers();
}


    /* ================= VIDEOS ================= */

    async function getVideos() {
      const res = await fetch(`${API}/videos`);
      const data = await res.json();

      const container = document.getElementById("videos");
      container.innerHTML = "";

      data.forEach(video => {

        let assignInfo = video.id_user
          ? `Assigned to User ID: ${video.id_user}`
          : "Not assigned";

        container.innerHTML += `
          <div style="margin-bottom:10px; padding:10px; border:1px solid #aaa;">
            <strong>ID:</strong> ${video.id_video} <br>
            <strong>Title:</strong> ${video.title || "No title"} <br>
            ${assignInfo}
          </div>
        `;
      });
    }

    /* ================= ASSIGN ================= */

    async function assignVideo() {
      const videoId = document.getElementById("videoId").value;
      const juryId = document.getElementById("juryId").value;

      await fetch(`${API}/videos/${videoId}/assign`, {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ id_user: juryId })
      });

      alert("Video assigned!");
      getVideos();
    }

  </script>

</body>
</html>
